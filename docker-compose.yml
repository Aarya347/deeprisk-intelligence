services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: depdash
      POSTGRES_PASSWORD: depdash
      POSTGRES_DB: depdash
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://depdash:depdash@db:5432/depdash
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    ports: ["8000:8000"]
    depends_on: [db]

  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  pgdata:
